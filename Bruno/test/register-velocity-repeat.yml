info:
  name: register-velocity-repeat
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:8081/api/v1/auth/register
  body:
    type: json
    data: |-
      {
        "username": "{{velEmail}}",
        "email": "{{velEmail}}",
        "password": "Password1",
        "fullName": "Velocity Test"
      }

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("velEmail", "velocity" + Date.now() + Math.floor(Math.random()*1000) + "@example.com");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
