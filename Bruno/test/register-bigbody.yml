info:
  name: register-bigbody
  type: http
  seq: 3

http:
  method: POST
  url: {{baseUrl}}/api/v1/auth/register
  body:
    type: json
    data: |-
      {
        "username": "{{bbEmail}}",
        "email": "{{bbEmail}}",
        "password": "Password123",
        "fullName": "Valid Name",
        "padding": "{{padding}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("padding", "a".repeat(2000));
        bru.setVar("bbEmail", "bigbody" + Date.now() + "@example.com");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
