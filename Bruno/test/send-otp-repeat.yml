info:
  name: send-otp-repeat
  type: http
  seq: 1

http:
  method: POST
  url: {{baseUrl}}/api/v1/auth/mfa/send-otp
  body:
    type: json
    data: |-
      {
        "purpose": "login"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
