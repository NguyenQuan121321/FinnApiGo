info:
  name: verify-otp-wrong-code
  type: http
  seq: 2

http:
  method: POST
  url: {{baseUrl}}/api/v1/auth/mfa/verify-otp
  body:
    type: json
    data: |-
      {
        "code": "021432",
        "purpose": "login"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
