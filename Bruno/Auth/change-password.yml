info:
  name: change-password
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/change-password"
  body:
    type: json
    data: |-
      {
        "oldPassword": "Password123",
        "newPassword": "NewPassword456"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
