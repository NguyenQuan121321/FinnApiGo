info:
  name: login
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: User-Agent
      value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128.0.0.0
  body:
    type: json
    data: |-
      {
        "email": "nguyenhoanganhquan13@gmail.com",
        "password": "Password123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const data = res.getBody().data;
          if (data.accessToken) {
            bru.setVar("accessToken", data.accessToken);
          }
          if (data.refreshToken) {
            bru.setVar("refreshToken", data.refreshToken);
          }
          if (data.mfaRequired && data.mfaToken) {
            bru.setVar("mfaToken", data.mfaToken);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
