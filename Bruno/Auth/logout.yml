info:
  name: logout
  type: http
  seq: 10

http:
  method: POST
  url: http://localhost:8081/api/v1/auth/logout
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
