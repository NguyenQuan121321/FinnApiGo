info:
  name: me-erase
  type: http
  seq: 21

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/auth/me"
  body:
    type: json
    data: |-
      {
        "password": "Password123"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

headers:
  - name: X-Sudo-Token
    value: "{{sudoToken}}"
    enabled: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
