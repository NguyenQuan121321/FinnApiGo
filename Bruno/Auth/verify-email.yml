info:
  name: verify-email
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/verify-email"
  body:
    type: json
    data: |-
      {
        "token": "{{accessToken}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
