info:
  name: passkey-auth-challenge
  type: http
  seq: 3

# Step-up assertion options (UV required). The assertion response must come
# from a real authenticator.
http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/mfa/passkey/authenticate/challenge"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
