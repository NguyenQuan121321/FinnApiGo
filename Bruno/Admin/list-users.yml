info:
  name: list-users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/users?page=1&limit=20"
  body:
    type: none
  auth:
    type: bearer
    token: "{{adminAccessToken}}"

headers:
  - name: X-Tenant-ID
    value: "{{tenantId}}"
    enabled: true

settings:
  encodeUrl: true
