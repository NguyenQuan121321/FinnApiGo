info:
  name: totp-disable
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/mfa/totp/disable"
  body:
    type: json
    data: |-
      {
        "password": "Password123",
        "code": "123456"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

headers:
  - name: X-Sudo-Token
    value: "{{sudoToken}}"
    enabled: false

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
