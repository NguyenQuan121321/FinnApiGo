info:
  name: recovery-codes-view
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:8081/api/v1/auth/mfa/totp/recovery-codes
  body:
    type: json
    data: |-
      {
        "code": "756688"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const data = res.getBody().data;
          if (data.sudoToken) {
            bru.setVar("sudoToken", data.sudoToken);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
