info:
  name: login-verify
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/mfa/login-verify"
  body:
    type: json
    data: |-
      {
        "code": "726957"
      }
  auth:
    type: bearer
    token: "{{mfaToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const data = res.getBody().data;
          if (data.accessToken) {
            bru.setVar("accessToken", data.accessToken);
          }
          if (data.refreshToken) {
            bru.setVar("refreshToken", data.refreshToken);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
