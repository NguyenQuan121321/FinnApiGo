info:
  name: recovery-codes-regenerate
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/mfa/totp/recovery-codes/regenerate"
  headers:
    - name: X-Sudo-Token
      value: "{{sudoToken}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
