name: Release

on:
  push:
    tags:
      - 'v*'

# Restrict permissions to the minimum required for release creation
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    name: Release (GoReleaser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (SHA-pinned)
        with:
          go-version: '1.26.7'
          cache: true

      - name: Install Syft for SBOM generation
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2 (SHA-pinned)

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@90a3faa9d01826838573329317ddec43f8e02525 # v6.2.1 (SHA-pinned)
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
