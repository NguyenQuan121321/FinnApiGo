name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs on the same ref — a new push invalidates the older
# run's verdict, so burning runners on it is waste, not safety.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (SHA-pinned)
        with:
          go-version: '1.26.7'
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 (SHA-pinned)
        with:
          version: v2.12.2 # pinned to match the local dev toolchain

      - name: Go Test
        run: go test ./... -race -cover

      - name: Go Build
        run: go build ./...

      - name: Install govulncheck
        # Pinned — an unpinned @latest scanner is a non-reproducible supply
        # chain hole of exactly the class this pipeline exists to close.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

  integration:
    name: Integration (MySQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: finnapigo_test
          MYSQL_USER: test
          MYSQL_PASSWORD: testpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -prootpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (SHA-pinned)
        with:
          go-version: '1.26.7'
          cache: true

      # T1 — the integration-tagged suite against REAL service containers:
      # migration up/down proof, EXPLAIN plan assertions (D1), Redis
      # fixed-window/guard semantics, and concurrent-rotation single-winner.
      # The suite carries its own guard test: a missing env var in CI FAILS
      # the job instead of silently skipping every test to green.
      - name: Go Test (integration tag)
        env:
          TEST_MYSQL_DSN: 'test:testpw@tcp(127.0.0.1:3306)/finnapigo_test'
          TEST_REDIS_URL: 'redis://127.0.0.1:6379/0'
        run: go test -tags=integration ./... -race -count=1

  fuzz:
    name: Fuzz smoke (30s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (SHA-pinned)
        with:
          go-version: '1.26.7'
          cache: true

      # T2 — 30-second smoke per fuzz target. Full-time runs are local/nightly.
      - name: Fuzz JWT parsing
        run: go test ./internal/jwt/ -run='^$' -fuzz=FuzzJWTVerify -fuzztime=30s

      - name: Fuzz TOTP code validation
        run: go test ./internal/services/ -run='^$' -fuzz=FuzzTOTPCodeValidation -fuzztime=30s

      - name: Fuzz recovery-code consumption
        run: go test ./internal/services/ -run='^$' -fuzz=FuzzRecoveryCodeConsumption -fuzztime=30s

  coverage:
    name: Coverage floors (T3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (SHA-pinned)
        with:
          go-version: '1.26.7'
          cache: true

      # T3 — per-package ratchet floors set at the measured coverage of the
      # 2026-08 remediation batch. Raise the numbers as tests improve; NEVER
      # lower them. (Previously only services/jwt were floored — a PR could
      # gut middleware tests and every gate stayed green.)
      - name: Per-package coverage floors
        run: |
          set -euo pipefail
          floors=(
            "internal/services:73.0"
            "internal/jwt:91.0"
            "internal/middleware:80.0"
            "internal/crypto:88.5"
            "internal/logging:94.5"
            "internal/device:82.0"
            "internal/config:79.0"
            "internal/response:100.0"
            "internal/jobs:64.0"
            "internal/routes:64.0"
            "internal/repositories:66.0"
            "internal/store:54.5"
            "internal/handlers:45.0"
            "internal/hash:38.0"
          )
          fail=0
          for entry in "${floors[@]}"; do
            pkg="${entry%%:*}"; floor="${entry##*:}"
            go test "./$pkg/" -count=1 -coverprofile=cover.out > /dev/null
            pct=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
            echo "$pkg coverage: ${pct}% (floor $floor)"
            if ! awk -v p="$pct" -v f="$floor" 'BEGIN { exit (p+0 < f+0) ? 1 : 0 }'; then
              echo "::error::$pkg coverage ${pct}% is below floor ${floor}%"
              fail=1
            fi
          done
          exit $fail

  security:
    name: Security scans (T4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (SHA-pinned)
        with:
          go-version: '1.26.7'
          cache: true

      # T4a — dedicated gosec run (the linter already includes gosec; this
      # standalone run is the explicit gate with its own failure signal).
      # Pinned version — see the govulncheck note in the build job.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -exclude-generated -quiet ./...

      # T4b — container/config scan: Dockerfile + compose misconfigurations
      # and dependency-lock vulnerabilities (go.mod/go.sum).
      - name: Trivy filesystem/config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA-pinned)
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  image:
    name: Container image build + scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      # The Dockerfile was previously NEVER executed in CI — Render built it
      # first. Building here proves the deploy artifact compiles and closes
      # the base-image blind spot below.
      - name: Build production image
        run: docker build -t finnapigo:ci .

      - name: Trivy image scan (HIGH,CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA-pinned)
        with:
          image-ref: finnapigo:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # artifact upload
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      # Supply-chain transparency (NIST SSDF PS.3.2, SLSA): every push emits a
      # CycloneDX SBOM of the module graph (go.mod + go.sum) as a build
      # artifact. Consumers and incident response can diff component inventories
      # release over release.
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2 (SHA-pinned)
        with:
          format: cyclonedx-json
          artifact-name: finnapigo-sbom.cdx.json
          upload-artifact: true
