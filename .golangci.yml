version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - depguard
  settings:
    depguard:
      rules:
        services:
          files:
            - "**/internal/services/**/*.go"
          deny:
            - pkg: "github.com/gin-gonic/gin"
              desc: "Services must not depend on HTTP framework"
