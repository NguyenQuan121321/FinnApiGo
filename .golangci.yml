version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck    # unchecked errors
    - govet       # suspicious constructs
    - staticcheck # bugs, performance, style — subsumes gosimple + stylecheck in v2
    - ineffassign # useless assignments
    - unused      # unused code
    - gosec       # security scanner
    - gocritic    # opinionated quality checks
    - exhaustive  # enum switch completeness
    - nilerr      # returning nil when err != nil
    - errorlint   # proper error wrapping (errors.Is/As over == / type asserts)
    - depguard    # import restrictions
  # Lines carrying a #nosec annotation are suppressed for gosec across BOTH
  # gates: the standalone gosec step in the security job reads #nosec natively,
  # and this exclusion makes golangci-lint agree with it. One justified
  # annotation (e.g. the HIBP protocol-defined SHA-1 digest), one verdict.
  exclusions:
    rules:
      - linters:
          - gosec
        source: "#nosec"
  settings:
    depguard:
      rules:
        services:
          files:
            - "**/internal/services/**/*.go"
          deny:
            - pkg: "github.com/gin-gonic/gin"
              desc: "Services must not depend on HTTP framework"
